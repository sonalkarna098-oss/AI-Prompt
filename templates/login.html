{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5 col-lg-4 animate__animated animate__zoomIn">
        <div class="auth-card">
            <div class="text-center mb-4">
                <div class="rounded-circle d-inline-flex p-3 mb-2" style="background-color: var(--beeswax-saturate);">
                    <i class="bi bi-shield-lock-fill fs-2" style="color: var(--text-main);"></i>
                </div>
                <h3 class="fw-bold" style="color: var(--text-main);">Welcome Back</h3>
                <p class="small" style="color: var(--text-muted);">Sign in to access your AI workspace</p>
            </div>
            
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-semibold" style="color: var(--text-main);">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label small fw-semibold" style="color: var(--text-main);">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-beeswax w-100 mb-3">
                    Sign In <i class="bi bi-arrow-right-short ms-1 fs-5 align-middle"></i>
                </button>
            </form>

            <div class="text-center mt-3">
                <small style="color: var(--text-muted);">Don't have an account? 
                    <a href="{{ url_for('signup') }}" class="fw-bold text-decoration-none" style="color: var(--beeswax-dark);">Sign Up</a>
                </small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
